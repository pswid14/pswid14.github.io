<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Paige Swid's portfolio">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Paige Swid</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Figtree:ital,wght@0,400;0,500;0,700;1,400&family=DM+Mono:wght@400;500&display=swap">
<style id="st">
/* Layout: oversized name, then a row of colored folder tabs; the open tab's color fills the panel below it. */
:root{
  --bg:#F6F5FB; --fg:#1A1423; --muted:#5E5870; --surface:#FFFFFF; --edge:#1A1423; --ink:#1A1423;
  --t-about:#FF6B4A; --t-resume:#FFC93C; --t-projects:#2EC4B6; --t-work:#FF8FC7; --t-contact:#6C8CFF;
  --display:"Syne",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14111C; --fg:#F1EEF7; --muted:#A8A1B8; --surface:#211C2C; --edge:#000000;
  --t-about:#FF7A5C; --t-resume:#FFD15C; --t-projects:#3DD1C3; --t-work:#FF9DCF; --t-contact:#7F9BFF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14111C; --fg:#F1EEF7; --muted:#A8A1B8; --surface:#211C2C; --edge:#000000;
  --t-about:#FF7A5C; --t-resume:#FFD15C; --t-projects:#3DD1C3; --t-work:#FF9DCF; --t-contact:#7F9BFF; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.6}
a{color:inherit;text-underline-offset:3px}
:focus-visible{outline:3px solid var(--edge);outline-offset:3px}
.wrap{max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:48px 110px;display:flex;flex-direction:column;gap:36px}
header{display:flex;flex-direction:column;gap:14px;position:relative}
.eyebrow{font-family:var(--mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:12px}
.dots{display:flex}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--bg);margin-left:-5px}
.dots i:first-child{margin-left:0}
h1{font-family:var(--display);font-weight:800;font-size:clamp(56px,12vw,136px);line-height:.9;margin:0;letter-spacing:-.03em;text-wrap:balance}
h1 .l{display:inline-block}
h1 .w{white-space:nowrap}
.role{font-family:var(--body);font-weight:500;font-size:21px;color:var(--muted);margin:0;max-width:40ch}
.folder{display:flex;flex-direction:column}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-top:10px;padding-inline:4px}
.tabs::-webkit-scrollbar{display:none}
.tab{font-family:var(--display);font-weight:700;font-size:16px;color:var(--ink);background:var(--c);border:2px solid var(--edge);border-bottom:0;border-radius:14px 14px 0 0;padding:12px 20px 14px;cursor:pointer;white-space:nowrap;transform:translateY(6px);filter:saturate(.75) brightness(.97);transition:transform .18s,filter .18s}
.tab:hover{transform:translateY(0);filter:none}
.tab[aria-selected="true"]{transform:translateY(2px);filter:none;position:relative;z-index:2;padding-bottom:18px;margin-bottom:-2px}
.panel{position:relative;background:var(--c);color:var(--ink);border:2px solid var(--edge);border-radius:0 18px 18px 18px;box-shadow:8px 8px 0 var(--edge);padding:40px clamp(20px,5vw,48px);min-height:340px;display:flex;flex-direction:column;gap:28px;overflow:hidden;min-width:0}
.panel>*{position:relative;z-index:1}
.ghost{position:absolute!important;z-index:0!important;right:-.06em;bottom:-.22em;font-family:var(--display);font-weight:800;font-size:clamp(90px,18vw,200px);line-height:1;letter-spacing:-.04em;color:transparent;-webkit-text-stroke:2px rgba(26,20,35,.18);pointer-events:none;user-select:none;white-space:nowrap}
.blob{position:absolute!important;z-index:0!important;border-radius:50%;border:2px solid rgba(26,20,35,.15);pointer-events:none}
.btn{font-family:var(--mono);font-size:13px;font-weight:500;border:2px solid var(--edge);background:var(--surface);color:var(--fg);padding:8px 14px;border-radius:999px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px;box-shadow:3px 3px 0 var(--edge);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--edge)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--edge)}
.btn.primary{background:var(--ink);color:#FFFFFF;border-color:var(--ink)}
.btn.small{padding:3px 10px;font-size:12px;box-shadow:2px 2px 0 var(--edge)}
.row{display:flex;flex-wrap:wrap;gap:10px}
h2{font-family:var(--display);font-weight:800;font-size:28px;margin:0;letter-spacing:-.01em}
.sub{display:flex;flex-direction:column;gap:18px}
.bio{font-size:clamp(20px,2.6vw,26px);line-height:1.5;max-width:52ch;margin:0;white-space:pre-line;font-weight:500}
.empty{display:flex;flex-direction:column;gap:6px;margin:auto 0}
.empty b{font-family:var(--display);font-weight:800;font-size:clamp(36px,6vw,56px);line-height:1;letter-spacing:-.02em}
.empty span{font-family:var(--mono);font-size:13px;opacity:.75}
.list{display:flex;flex-direction:column;gap:14px}
.item{display:grid;grid-template-columns:140px minmax(0,1fr);gap:20px;background:var(--surface);color:var(--fg);border:2px solid var(--edge);border-radius:14px;padding:18px 20px}
.when{font-family:var(--mono);font-size:13px;color:var(--muted);padding-top:3px;font-variant-numeric:tabular-nums;display:flex;gap:4px;flex-wrap:wrap;align-content:start}
.item h3{font-family:var(--display);font-weight:700;font-size:20px;margin:0;line-height:1.25}
.org{color:var(--muted);font-style:italic}
.item p{margin:6px 0 0;max-width:62ch}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.card{background:var(--surface);color:var(--fg);border:2px solid var(--edge);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:10px;min-width:0;box-shadow:5px 5px 0 var(--edge)}
.card:nth-child(odd){transform:rotate(-.6deg)}
.card:nth-child(even){transform:rotate(.6deg)}
.card h3{font-family:var(--display);font-weight:700;font-size:21px;margin:0}
.card .yr{font-family:var(--mono);font-size:12px;color:var(--muted)}
.card p{margin:0;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--mono);font-size:12px;background:var(--c);color:var(--ink);border:1.5px solid var(--edge);padding:2px 10px;border-radius:999px}
.panel>.chips .chip{background:var(--surface);color:var(--fg)}
.contact{display:flex;flex-direction:column;gap:18px}
.email{font-family:var(--display);font-size:clamp(24px,4vw,36px);font-weight:700;user-select:all;word-break:break-all}
.toolbar{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center;background:var(--surface);border:2px solid var(--edge);border-radius:999px;padding:8px;box-shadow:4px 4px 0 var(--edge);z-index:20;flex-wrap:wrap;max-width:calc(100vw - 32px)}
.status{font-family:var(--mono);font-size:12px;color:var(--muted);padding:0 8px}
.note{font-family:var(--mono);font-size:13px;background:var(--surface);color:var(--fg);border:2px dashed var(--edge);border-radius:12px;padding:12px 14px;line-height:1.6;display:flex;flex-direction:column;gap:6px}
.editing [data-path]{outline:1.5px dashed currentColor;outline-offset:3px;border-radius:3px;min-width:2ch;display:inline-block}
.editing [data-path]:focus{outline:2.5px solid currentColor}
.editing [data-path]:empty::before{content:attr(data-ph);opacity:.55}
.field{font-family:var(--mono);font-size:12px;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;opacity:.95}
.field [data-path]{word-break:break-all}
.ctl{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
@media (max-width:700px){
  .wrap{padding-block:28px 110px;gap:28px}
  .cards{grid-template-columns:minmax(0,1fr)}
  .item{grid-template-columns:minmax(0,1fr);gap:4px}
  .tabs{gap:3px;padding-inline:2px}
  .tab{flex:1 1 auto;padding:9px 8px 11px;font-size:13px;border-radius:10px 10px 0 0}
  .tab[aria-selected="true"]{padding-bottom:15px}
  .panel{box-shadow:5px 5px 0 var(--edge);padding-block:28px}
}
@media (prefers-reduced-motion:no-preference){
  .panel{animation:rise .35s cubic-bezier(.2,.8,.2,1)}
  @keyframes rise{from{transform:translateY(8px)}to{transform:none}}
  h1 .l{animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
  @keyframes pop{from{transform:translateY(.15em) rotate(-4deg)}to{transform:none}}
}
@media (prefers-reduced-motion:reduce){.tab,.btn{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<script type="application/json" id="data">{"name":"Paige Swid","role":"","email":"","resumeUrl":"","bio":"","links":[{"label":"LinkedIn","url":"https://www.linkedin.com/in/paigeswid"}],"projects":[],"work":[],"experience":[],"education":[],"skills":""}</script>
<script id="app-js">
(function(){
  var dataEl=document.getElementById('data');
  var S=JSON.parse(dataEl.textContent);
  var TABS=[["about","About","Hello"],["resume","Résumé","CV"],["projects","Projects","Make"],["work","Work","Work"],["contact","Contact","Say hi"]];
  var tab=(location.hash||"").slice(1);
  if(!TABS.some(function(x){return x[0]===tab}))tab="about";
  var editing=false, dirty=false, art=null, canEdit=false, saving=false, backup=null;
  var LISTS={projects:{title:"",year:"",desc:"",tags:"",url:""},work:{title:"",year:"",desc:"",tags:"",url:""},experience:{title:"",org:"",start:"",end:"",desc:""},education:{title:"",org:"",start:"",end:"",desc:""},links:{label:"",url:""}};

  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function get(p){return p.split('.').reduce(function(o,k){return o==null?o:o[k]},S)}
  function set(p,v){var ks=p.split('.'),o=S;for(var i=0;i<ks.length-1;i++)o=o[ks[i]];o[ks[ks.length-1]]=v}
  function safeUrl(u){u=String(u||"").trim();return /^https?:\/\//i.test(u)?u:(u&&!/^[a-z]+:/i.test(u)?"https://"+u:"")}
  // Editable text: plain text when viewing, a contenteditable field when editing.
  function t(p,tag,cls,ph){
    var v=get(p);
    if(!editing){ if(!v)return ""; return "<"+tag+(cls?' class="'+cls+'"':"")+">"+esc(v)+"</"+tag+">"; }
    return "<"+tag+(cls?' class="'+cls+'"':"")+' data-path="'+p+'" data-ph="'+esc(ph||"")+'" contenteditable="true" spellcheck="true">'+esc(v)+"</"+tag+">";
  }
  function ctl(list,i){
    if(!editing)return "";
    var n=S[list].length;
    return '<div class="ctl">'+(i>0?'<button class="btn small" data-act="up" data-list="'+list+'" data-i="'+i+'">Move up</button>':"")+(i<n-1?'<button class="btn small" data-act="down" data-list="'+list+'" data-i="'+i+'">Move down</button>':"")+'<button class="btn small" data-act="del" data-list="'+list+'" data-i="'+i+'">Remove</button></div>';
  }
  function addBtn(list,label){return editing?'<div><button class="btn" data-act="add" data-list="'+list+'">+ '+label+'</button></div>':""}
  function initials(n){return (String(n||"?").trim().split(/\s+/).map(function(w){return w[0]||""}).join("").slice(0,2)||"?").toUpperCase()}
  function chips(s){return String(s||"").split(",").map(function(x){return x.trim()}).filter(Boolean).map(function(x){return '<span class="chip">'+esc(x)+'</span>'}).join("")}
  var EMPTY='<div class="empty"><b>Coming soon.</b><span>Check back shortly.</span></div>';

  function timeline(list,addLabel){
    if(!editing&&!S[list].length)return "";
    return '<div class="list">'+S[list].map(function(e,i){
      var b=list+"."+i+".";
      var when=editing?t(b+"start","span","","Start")+"<span>–</span>"+t(b+"end","span","","End"):esc([e.start,e.end].filter(Boolean).join(" – "));
      return '<div class="item"><div class="when">'+when+'</div><div>'+t(b+"title","h3","","Title")+'<div class="org">'+(editing?t(b+"org","span","","Organization"):esc(e.org))+'</div>'+t(b+"desc","p","","What you did")+ctl(list,i)+'</div></div>';
    }).join("")+'</div>'+addBtn(list,addLabel);
  }
  function cards(list,addLabel){
    if(!editing&&!S[list].length)return EMPTY;
    return '<div class="cards">'+S[list].map(function(p,i){
      var b=list+"."+i+".", u=safeUrl(p.url);
      return '<article class="card">'+(editing?t(b+"year","span","yr","Year"):(p.year?'<span class="yr">'+esc(p.year)+'</span>':""))+t(b+"title","h3","","Title")+t(b+"desc","p","","Description")+
        (editing?'<div class="field">Tags: '+t(b+"tags","span","","comma, separated")+'</div><div class="field">Link: '+t(b+"url","span","","https://…")+'</div>':'<div class="chips">'+chips(p.tags)+'</div>'+(u?'<a href="'+esc(u)+'" target="_blank" rel="noopener" style="font-family:var(--mono);font-size:13px">Open ↗</a>':""))+
        ctl(list,i)+'</article>';
    }).join("")+'</div>'+addBtn(list,addLabel);
  }

  function panel(){
    if(tab==="about"){
      if(!editing&&!S.bio)return EMPTY;
      return t("bio","p","bio","A few sentences about you");
    }
    if(tab==="resume"){
      var ru=safeUrl(S.resumeUrl), h="";
      if(editing)h+='<div class="note"><span>Résumé file: upload your PDF to Google Drive or Dropbox, set sharing to "anyone with the link", and paste the link here.</span>'+t("resumeUrl","span","","https://…")+'</div>';
      else if(ru)h+='<div><a class="btn primary" href="'+esc(ru)+'" target="_blank" rel="noopener">Open résumé (PDF) ↗</a></div>';
      var exp=timeline("experience","Add job"), edu=timeline("education","Add school");
      var sk=editing?'<div class="field">Comma separated: '+t("skills","span","","Skill, Skill")+'</div>':(S.skills?'<div class="chips">'+chips(S.skills)+'</div>':"");
      if(exp)h+='<div class="sub"><h2>Experience</h2>'+exp+'</div>';
      if(edu)h+='<div class="sub"><h2>Education</h2>'+edu+'</div>';
      if(sk)h+='<div class="sub"><h2>Skills</h2>'+sk+'</div>';
      return h||EMPTY;
    }
    if(tab==="projects")return cards("projects","Add project");
    if(tab==="work")return cards("work","Add work sample");
    if(tab==="contact"){
      var c='';
      if(editing)c+='<div class="field">Email: '+t("email","span","email","you@email.com")+'</div>';
      else if(S.email)c+='<span class="email" id="em">'+esc(S.email)+'</span><div><button class="btn" id="copy">Copy email</button></div>';
      var links=S.links.filter(function(l){return safeUrl(l.url)&&l.label});
      if(editing)c+='<div style="display:flex;flex-direction:column;gap:10px"><div class="field">Links</div>'+S.links.map(function(l,i){return '<div class="field">'+t("links."+i+".label","span","","Label")+t("links."+i+".url","span","","https://…")+'<button class="btn small" data-act="del" data-list="links" data-i="'+i+'">Remove</button></div>'}).join("")+addBtn("links","Add link")+'</div>';
      else if(links.length)c+='<div class="row">'+links.map(function(l){return '<a class="btn" href="'+esc(safeUrl(l.url))+'" target="_blank" rel="noopener">'+esc(l.label)+' ↗</a>'}).join("")+'</div>';
      return c?'<div class="contact">'+c+'</div>':EMPTY;
    }
    return "";
  }

  function render(){
    var cur=TABS.filter(function(x){return x[0]===tab})[0];
    var h='<div class="wrap'+(editing?' editing':'')+'">';
    h+='<header><div class="eyebrow"><span class="dots" aria-hidden="true">'+TABS.map(function(x){return '<i style="background:var(--t-'+x[0]+')"></i>'}).join("")+'</span>Portfolio</div>';
    if(editing)h+=t("name","h1","","Your name");
    else h+='<h1 aria-label="'+esc(S.name)+'">'+(function(){var k=0;return String(S.name||"").split(/\s+/).filter(Boolean).map(function(w){return '<span class="w" aria-hidden="true">'+Array.from(w).map(function(ch){return '<span class="l" style="animation-delay:'+(k++*35)+'ms">'+esc(ch)+'</span>'}).join("")+'</span>'}).join(" ")})()+'</h1>';
    h+=t("role","p","role","What you do (optional)")+'</header>';
    h+='<div class="folder"><div class="tabs" role="tablist">'+TABS.map(function(x){return '<button class="tab" role="tab" id="tab-'+x[0]+'" data-tab="'+x[0]+'" style="--c:var(--t-'+x[0]+')" aria-selected="'+(x[0]===tab)+'">'+x[1]+'</button>'}).join("")+'</div>';
    h+='<div class="panel" role="tabpanel" aria-labelledby="tab-'+tab+'" style="--c:var(--t-'+tab+')"><span class="ghost" aria-hidden="true">'+esc(cur[2])+'</span><span class="blob" aria-hidden="true" style="width:180px;height:180px;right:12%;top:-70px"></span><span class="blob" aria-hidden="true" style="width:70px;height:70px;right:6%;top:40px"></span>'+panel()+'</div></div>';
    h+='</div>';
    if(canEdit){
      h+='<div class="toolbar">'+(editing?'<span class="status" id="status">'+(dirty?"Unsaved changes":"Click dashed text to edit")+'</span><button class="btn" data-act="cancel">Cancel</button><button class="btn primary" data-act="save">Save</button>':'<button class="btn primary" data-act="edit">Edit page</button>')+'</div>';
    }
    document.getElementById('app').innerHTML=h;
  }

  function status(msg){var s=document.getElementById('status');if(s)s.textContent=msg}

  document.addEventListener('input',function(e){
    var el=e.target.closest&&e.target.closest('[data-path]');
    if(!el)return;
    set(el.getAttribute('data-path'),el.innerText.replace(/\n+$/,""));
    dirty=true;status("Unsaved changes");
  });
  document.addEventListener('paste',function(e){
    var el=e.target.closest&&e.target.closest('[data-path]');
    if(!el)return;
    e.preventDefault();
    var txt=(e.clipboardData||window.clipboardData).getData('text/plain');
    document.execCommand('insertText',false,txt);
  });

  document.addEventListener('click',function(e){
    var b=e.target.closest('button');
    if(!b)return;
    var tb=b.getAttribute('data-tab');
    if(tb){tab=tb;render();var f=document.getElementById('tab-'+tb);if(f)f.focus();return}
    if(b.id==='copy'){
      var em=document.getElementById('em');
      var p=navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(S.email):Promise.reject();
      p.then(function(){b.textContent="Copied"},function(){var r=document.createRange();r.selectNodeContents(em);var sel=getSelection();sel.removeAllRanges();sel.addRange(r);b.textContent="Selected, press copy"});
      setTimeout(function(){b.textContent="Copy email"},2000);
      return;
    }
    var act=b.getAttribute('data-act');if(!act)return;
    var list=b.getAttribute('data-list'),i=+b.getAttribute('data-i');
    if(act==='edit'){editing=true;dirty=false;backup=JSON.stringify(S);render();return}
    if(act==='cancel'){S=JSON.parse(backup);editing=false;dirty=false;render();return}
    if(act==='save'){save();return}
    if(act==='add'){S[list].push(JSON.parse(JSON.stringify(LISTS[list])));}
    if(act==='del'){S[list].splice(i,1)}
    if(act==='up'&&i>0){var x=S[list][i];S[list][i]=S[list][i-1];S[list][i-1]=x}
    if(act==='down'&&i<S[list].length-1){var y=S[list][i];S[list][i]=S[list][i+1];S[list][i+1]=y}
    dirty=true;render();status("Unsaved changes");
  });

  function buildDoc(state){
    var headStyle=document.head&&document.head.querySelector('style');
    var reset=headStyle?headStyle.textContent:':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
    var font=document.querySelector('link[rel="stylesheet"][href*="fonts.googleapis"]');
    var json=JSON.stringify(state).replace(/</g,"\\u003c");
    var content='<title>'+esc(state.name||"Portfolio")+'</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n'+
      (font?'<link rel="stylesheet" href="'+esc(font.getAttribute('href'))+'">\n':'')+
      '<style id="st">'+document.getElementById('st').textContent+'</style>\n<div id="app"></div>\n'+
      '<script type="application/json" id="data">'+json+'<\/script>\n'+
      '<script id="app-js">'+document.getElementById('app-js').textContent+'<\/script>\n';
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'+content+'</body></html>';
  }

  function save(){
    if(saving||!art)return;
    if(!dirty){editing=false;render();return}
    saving=true;status("Saving…");
    var next=JSON.parse(JSON.stringify(S));
    try{sessionStorage.setItem("tab",tab)}catch(e){}
    art.publish(buildDoc(next)).then(function(){status("Saved")},function(err){
      saving=false;
      var c=err&&err.code;
      if(c==='conflict')status("Someone else saved first. Reloading their version.");
      else if(c==='not_writer'||c==='not_granted')status("This view can't save changes.");
      else if(c==='rate_limited')status("Saving too often. Wait a moment and press Save again.");
      else status("Couldn't save. Check your connection and press Save again.");
    });
  }

  try{var st=sessionStorage.getItem("tab");if(st&&!location.hash&&TABS.some(function(x){return x[0]===st}))tab=st;sessionStorage.removeItem("tab")}catch(e){}
  render();
  if(window.claude&&window.claude.use){
    Promise.all([window.claude.use("user"),window.claude.use("artifact")]).then(function(r){
      var u=r[0];art=r[1];
      if(!u||!art)return;
      return u.canEdit().then(function(ok){canEdit=!!ok;if(canEdit)render()});
    }).catch(function(){});
  }
})();
</script>
</body>
</html>
